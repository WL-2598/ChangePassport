name: Build artifacts (manual, no public release)

# Public releases require separate human confirmation. This workflow only builds
# local distribution artifacts; it never creates a GitHub Release or pushes a tag.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --disable-pip-version-check build
      - name: Build sdist and wheel
        run: python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: changepassport-dist
          path: dist/*
          if-no-files-found: error
